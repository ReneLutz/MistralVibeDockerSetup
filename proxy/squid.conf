# Vibe CLI egress allowlist: Mistral API + browser sign-in domains only, TLS only.
# Squid resolves CONNECT hostnames itself and dials the real IP,
# so a client cannot sneak past this list by lying about a name.

http_port 3128

# --- allowlist -------------------------------------------------------------
# api.mistral.ai    - model API
# auth.mistral.ai   - OAuth token exchange
# chat.mistral.ai   - sign-in / whoami / token flow (vibe_base)
# console.mistral.ai- console / whoami (console_base)
# Dedicated or self-hosted deployment? Add your console domain(s) here and
# set VIBE_CUSTOM_CONSOLE_URL accordingly (see docs: Admin config).
acl allowed_dst dstdomain api.mistral.ai
acl allowed_dst dstdomain auth.mistral.ai
acl allowed_dst dstdomain chat.mistral.ai
acl allowed_dst dstdomain console.mistral.ai

acl tls_ports port 443

# --- rules -----------------------------------------------------------------
http_access deny CONNECT !tls_ports
http_access allow CONNECT allowed_dst
http_access deny all

# Tunnel only - no caching.
cache deny all
